# Runs the whole app with one command (from the repo root):
#     docker compose -f deploy/compose.yaml up --build
# then open http://localhost:8080. Every service is its own container on a private network,
# standing in for its own server: they talk only over HTTP, Redis and Postgres.
#
# The defaults below are for LOCAL DEVELOPMENT ONLY (known passwords and secrets). To override,
# copy deploy/.env.example to deploy/.env; it is read if present. Never deploy with the defaults.
#
# The agent needs Ollama with the two models pulled. Either run Ollama on the host (it must listen
# on all interfaces: OLLAMA_HOST=0.0.0.0) or use the bundled one: add `--profile ollama` and set
# HUDDLE_OLLAMA_URL=http://ollama:11434 in deploy/.env. See deploy/README.md.
name: huddle

x-env: &shared-env
  HUDDLE_POSTGRES_DSN: ${HUDDLE_POSTGRES_DSN:-postgresql://postgres:postgres@postgres:5432/postgres}
  HUDDLE_REDIS_URL: ${HUDDLE_REDIS_URL:-redis://redis:6379/0}
  HUDDLE_JWT_SECRET: ${HUDDLE_JWT_SECRET:-dev-only-jwt-secret-change-me-0123456789abcdef}
  HUDDLE_SERVICE_TOKEN: ${HUDDLE_SERVICE_TOKEN:-dev-only-service-token}
  HUDDLE_CHAT_URL: http://chat:8001
  HUDDLE_SESSION_ID: ${HUDDLE_SESSION_ID:-ses_main}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  chat:
    build: {context: .., dockerfile: services/chat/Dockerfile}
    environment:
      <<: *shared-env
      HUDDLE_CORS_ORIGINS: ${HUDDLE_CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["127.0.0.1:8001:8001"]   # for debugging; the web container proxies to it internally
    restart: unless-stopped

  gateway:
    build: {context: .., dockerfile: services/gateway/Dockerfile}
    environment:
      <<: *shared-env
      HUDDLE_GATEWAY_ID: ${HUDDLE_GATEWAY_ID:-gw-1}
    depends_on:
      redis: {condition: service_healthy}
      chat: {condition: service_healthy}
    ports: ["127.0.0.1:8000:8000"]
    restart: unless-stopped

  agent:
    build: {context: .., dockerfile: services/agent/Dockerfile}
    environment:
      <<: *shared-env
      HUDDLE_OLLAMA_URL: ${HUDDLE_OLLAMA_URL:-http://host.docker.internal:11434}
      HUDDLE_DECIDER_MODEL: ${HUDDLE_DECIDER_MODEL:-llama3.2:3b}
      HUDDLE_WRITER_MODEL: ${HUDDLE_WRITER_MODEL:-llama3.1:8b}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      chat: {condition: service_healthy}
    extra_hosts: ["host.docker.internal:host-gateway"]   # reach an Ollama running on the host
    restart: unless-stopped

  web:
    build: {context: .., dockerfile: apps/web/Dockerfile}
    depends_on:
      chat: {condition: service_healthy}
      gateway: {condition: service_healthy}
    ports: ["8080:8080"]
    restart: unless-stopped

  # Optional: a bundled Ollama (CPU; add a GPU reservation for speed). Start with `--profile ollama`.
  ollama:
    profiles: [ollama]
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    ports: ["127.0.0.1:11434:11434"]

volumes:
  pgdata:
  ollama:
