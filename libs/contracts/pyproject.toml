[project]
name = "huddle-contracts"
version = "0.0.0"
description = "Shared wire contracts (pydantic models, Redis keys, budget math) for all Huddle services"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/huddle_contracts"]
