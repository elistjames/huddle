<!doctype html>
<html>
<head><meta charset="utf-8"><title>Icon preview</title>
<style>body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-sans);} #root{padding:var(--space-4);} .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:var(--space-2);} .cell{display:flex;flex-direction:column;align-items:center;gap:var(--space-1);padding:var(--space-2) 0;color:var(--ink-muted);font-size:11px;line-height:16px;} .cell svg{color:var(--ink);} .cap{font-size:11px;line-height:16px;font-weight:500;letter-spacing:.02em;color:var(--ink-muted);margin:var(--space-2) 0 var(--space-1);} .reserved svg{color:var(--ink-muted);}</style>
</head>
<body>
<div id="root"></div>
<script>
  var H = window.Huddle, h = React.createElement;
  var USED = ['send','check','clock','wifi-off','circle-alert','rotate-ccw','pause','play','download','chevron-down','x','users','settings','ellipsis'];
  var reserved = H.Icon.names.filter(function (n) { return USED.indexOf(n) < 0; });
  function grid(names, cls) { return h('div', { className: 'grid' }, names.map(function (n) { return h('div', { key: n, className: 'cell ' + (cls || '') }, h(H.Icon, { name: n }), n); })); }
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', null,
    h('div', { className: 'cap' }, 'Used in v1'), grid(USED),
    h('div', { className: 'cap' }, 'Reserved: not in v1 (phase 3 or out of scope)'), grid(reserved, 'reserved')));
</script>
</body>
</html>
