<!-- @dsCard group="Chat" height=440 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>MessageGroup preview</title>
<style>body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-sans);} #root{padding:var(--space-4);} .stack{display:flex;flex-direction:column;gap:var(--space-3);} .row{display:flex;gap:var(--space-3);align-items:center;flex-wrap:wrap;} .cap{font-size:11px;line-height:16px;font-weight:500;letter-spacing:.02em;color:var(--ink-muted);margin:var(--space-2) 0 var(--space-1);} </style>
</head>
<body>
<div id="root"></div>
<script>
  var H = window.Huddle, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { style: { maxWidth: '640px' } },
      h(H.MessageGroup, { author: 'Maya Chen', kind: 'other', time: '10:42', messages: ['Draft of the launch post is in the doc', 'mostly worried the intro is too long'] }),
      h(H.MessageGroup, { author: 'Jordan Reyes', kind: 'other', time: '10:44', messages: ['reading now'] }),
      h(H.MessageGroup, { author: 'Huddle AI', kind: 'agent', time: '10:45', messages: ['The first two paragraphs say the same thing. Cutting the second gets the intro to about 60 words.'] }),
      h(H.MessageGroup, { kind: 'self', time: '10:46', messages: [{ text: 'agreed, cutting it', status: 'agent-read' }, { text: 'sending the new draft over now', status: 'delivered' }, { text: 'thanks both', status: 'stored' }] })));
</script>
</body>
</html>
