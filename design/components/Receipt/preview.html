<!doctype html>
<html>
<head><meta charset="utf-8"><title>Receipt preview</title>
<style>body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-sans);} #root{padding:var(--space-4);} .stack{display:flex;flex-direction:column;gap:var(--space-3);} .row{display:flex;gap:var(--space-3);align-items:center;flex-wrap:wrap;} .cap{font-size:11px;line-height:16px;font-weight:500;letter-spacing:.02em;color:var(--ink-muted);margin:var(--space-2) 0 var(--space-1);} </style>
</head>
<body>
<div id="root"></div>
<script>
  var H = window.Huddle, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'row', style: { gap: 'var(--space-8)' } },
      [['sending','Sending'],['stored','Stored'],['delivered','Delivered'],['agent-read','Read by the AI']].map(function (s) {
        return h('div', { key: s[0], style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 'var(--space-2)' } },
          h('div', { style: { transform: 'scale(2)', transformOrigin: 'center', height: '28px', display: 'flex', alignItems: 'center' } }, h(H.Receipt, { status: s[0] })),
          h('span', { className: 'cap', style: { margin: 0 } }, s[1]));
      })));
</script>
</body>
</html>
