[project]
name = "huddle"
version = "0.0.0"
description = "Huddle: people and one AI agent in a single thread (workspace root)"
requires-python = ">=3.11"
dependencies = ["huddle-contracts", "huddle-gateway", "huddle-chat", "huddle-agent"]

[tool.uv.sources]
huddle-contracts = { workspace = true }
huddle-gateway = { workspace = true }
huddle-chat = { workspace = true }
huddle-agent = { workspace = true }

[tool.uv.workspace]
members = ["libs/*", "services/*"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "bandit>=1.7",
    "pyright>=1.1.380",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["libs/contracts/src", "services/gateway/src", "services/chat/src", "services/agent/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]  # assert is fine in tests; bandit covers src

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S311"]

[tool.pyright]
include = ["libs", "services"]
exclude = ["**/.venv", "**/node_modules"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["libs", "services"]
markers = [
    "integration: needs real Postgres/Redis (set HUDDLE_REQUIRE_STORES=1 in CI to fail instead of skip)",
]
addopts = "-ra --strict-markers"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
