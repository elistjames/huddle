[project]
name = "huddle-chat"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "huddle-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.53.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5",
    "pyjwt>=2.8",
    "python-ulid>=2",
    "httpx>=0.27",
]

[tool.uv.sources]
huddle-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/huddle_chat"]
