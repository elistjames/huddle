[project]
name = "huddle-agent"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "huddle-contracts",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "redis>=5",
    "sqlalchemy[asyncio]>=2.1.1",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "python-ulid>=2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
huddle-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/huddle_agent"]
