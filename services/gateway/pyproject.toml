[project]
name = "huddle-gateway"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "huddle-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.54.0",
    "redis>=5",
    "httpx>=0.27",
    "pyjwt>=2.8",
]

[tool.uv.sources]
huddle-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/huddle_gateway"]
